name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      appName:
        description: 'App Name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create TWA Manifest
        run: |
          mkdir pwa-project
          cd pwa-project
          HOST=$(echo "${{ github.event.inputs.url }}" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          PKG="com.web2apk.$(echo $HOST | tr -dc 'a-zA-Z0-9' | tr '[:upper:]' '[:lower:]')"
          
          cat > twa-manifest.json <<MANIFEST
          {
            "packageId": "$PKG",
            "host": "$HOST",
            "name": "${{ github.event.inputs.appName }}",
            "launcherName": "${{ github.event.inputs.appName }}",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "themeColor": "#FFFFFF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/",
            "iconUrl": "https://www.pwabuilder.com/assets/icons/icon_512.png",
            "maskableIconUrl": "https://www.pwabuilder.com/assets/icons/icon_512.png",
            "splashScreenFadeOutDuration": 300,
            "fallbackType": "customtabs",
            "features": {}
          }
          MANIFEST

      - name: Build APK using action
        uses: sharadcodes/pwa-to-apk-action@v1
        with:
          project-root-folder: pwa-project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: pwa-project/*.apk
