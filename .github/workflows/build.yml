name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      appName:
        description: 'App Name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          npm i -g @bubblewrap/cli

      - name: Create TWA Manifest
        run: |
          mkdir pwa-project
          cd pwa-project
          HOST=$(echo "${{ github.event.inputs.url }}" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          PKG="com.web2apk.$(echo $HOST | tr -dc 'a-zA-Z0-9' | tr '[:upper:]' '[:lower:]')"
          
          cat > twa-manifest.json <<MANIFEST
          {
            "packageId": "$PKG",
            "host": "$HOST",
            "name": "${{ github.event.inputs.appName }}",
            "launcherName": "${{ github.event.inputs.appName }}",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "themeColor": "#FFFFFF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/",
            "iconUrl": "https://www.pwabuilder.com/assets/icons/icon_512.png",
            "maskableIconUrl": "https://www.pwabuilder.com/assets/icons/icon_512.png",
            "splashScreenFadeOutDuration": 300,
            "fallbackType": "customtabs",
            "features": {}
          }
          MANIFEST

      - name: Build APK using bubblewrap
        run: |
          cd pwa-project
          bubblewrap build --skipPwaValidation --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: pwa-project/*.apk
